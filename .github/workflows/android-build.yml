name: Build & Release Debug APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Every build deletes and recreates the single moving pre-release tag, so two
# overlapping runs would race each other and can leave a half-created release.
concurrency:
  group: apk-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Decode signing keystore
        shell: bash
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          if ! base64 -d > "$RUNNER_TEMP/keystore/prerelease_keystore.keystore" <<< "$KS_B64" 2>/tmp/b64.err; then
            echo "::error::base64 decode failed: $(cat /tmp/b64.err)"
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/keystore/prerelease_keystore.keystore" ]; then
            echo "::error::Decoded keystore is empty. Check SIGNING_KEYSTORE_BASE64."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/keystore/prerelease_keystore.keystore" -storepass "$KS_PASS" 2>&1; then
            echo "::error::keytool could not read the keystore. Check store password and that the file is a valid keystore."
            exit 1
          fi
          echo "Keystore ready at $RUNNER_TEMP/keystore"

      - name: Show Gradle projects
        run: ./gradlew projects

      - name: Build Stable & Prerelease APKs
        run: ./gradlew :app:assembleRelease
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

      - name: Prepare APK assets
        id: assets
        run: |
          echo "Generated APKs:"
          find . -type f -name "*.apk"
          VERSION=$(grep -oP 'versionName = "\K[^"]+' gradle/libs.versions.toml | head -n1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "APK version: $VERSION"
          mkdir -p dist
          cp app/build/outputs/apk/prerelease/release/app-prerelease-release.apk dist/app-prerelease-release.apk
          cp app/build/outputs/apk/stable/release/app-stable-release.apk "dist/$VERSION.apk"
          ls -la dist

      - name: Cleanup previous automatic release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete pre-release --yes --cleanup-tag || true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.assets.outputs.version }}
        run: |
          # Publish in a single POST on purpose. softprops/action-gh-release creates the
          # release as a draft and then flips it with PATCH /releases/{id}, which this
          # repository's workflow token cannot do ("Resource not accessible by
          # integration"). That left every release a draft, and a draft is invisible to
          # GET /releases/tags/<tag>, so the in-app updater failed with a 404.
          gh release create pre-release \
            --target "$GITHUB_SHA" \
            --title "CloudStream v$VERSION" \
            --notes "Automatic build of the latest code. App version: $VERSION" \
            "dist/app-prerelease-release.apk" \
            "dist/$VERSION.apk"

      - name: Verify the release is published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          draft=$(gh api "repos/${{ github.repository }}/releases/tags/pre-release" --jq .draft)
          if [ "$draft" != "false" ]; then
            echo "::error::pre-release is a draft; the in-app updater will get a 404 on /releases/tags/pre-release"
            exit 1
          fi
          echo "pre-release is published and discoverable by tag"
          
